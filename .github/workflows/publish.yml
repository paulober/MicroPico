name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload release assets
      packages: read # @paulober/pico-mpy-com from GitHub Packages
      id-token: write # build provenance
      attestations: write

    env:
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          registry-url: "https://npm.pkg.github.com"
          scope: "@paulober"
          token: ${{ secrets.GITHUB_TOKEN }}
          # never restore a cache into a release build
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies and download stubs
        shell: bash
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
          npm ci --no-audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        run: ./scripts/package.sh

      - name: Generate SBOM
        run: node scripts/sbom.mjs > "micropico-${RELEASE_TAG_NAME}.cdx.json"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            micropico-*.vsix
            micropico-*.cdx.json

      - name: Upload to the release
        run: gh release upload "$RELEASE_TAG_NAME" micropico-*.vsix micropico-*.cdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the Marketplace and Open VSX
        run: ./scripts/publish.sh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
